name: foodie
description: A food delivery app built with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  
  # Networking
  dio: ^5.4.0
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Maps & Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.1.0
  
  # UI Components
  cached_network_image: ^3.3.1
  image_picker: ^1.0.5
  flutter_svg: ^2.0.9
  carousel_slider: ^5.0.0
  
  # Forms
  flutter_form_builder: ^9.1.1
  
  # Utilities
  intl: any
  url_launcher: ^6.2.2
  connectivity_plus: ^5.0.2
  path_provider: ^2.1.1
  logger: ^2.0.2+1
  http: ^1.1.0
  
  # Firebase (bỏ Storage vì cần trả phí)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf

